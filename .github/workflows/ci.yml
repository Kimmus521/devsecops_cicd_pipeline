name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt bandit

      - name: Run Flake8
        run: |
          python -m flake8 app.py tests

      - name: Run Unit Tests
        run: |
          python -m pytest

      - name: Scan application code with Bandit
        run: |
          python -m bandit app.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan git history with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  container-security:
    runs-on: ubuntu-latest
    needs: [test, secret-scan]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build --pull -t devsecops-app:ci .

      - name: Test application inside image
        run: |
          docker run --rm \
            --cap-drop=ALL \
            --security-opt no-new-privileges=true \
            devsecops-app:ci \
            python -m pytest -p no:cacheprovider

      - name: Export image for scanning
        run: |
          docker save \
            -o "${{ runner.temp }}/devsecops-image.tar" \
            devsecops-app:ci

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v "${{ runner.temp }}:/scan:ro" \
            aquasec/trivy:0.75.0 image \
            --input /scan/devsecops-image.tar \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1

  aws-auth-check:
    runs-on: ubuntu-latest
    needs: [container-security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "609231673661"

      - name: Verify AWS identity
        run: aws sts get-caller-identity --no-cli-pager