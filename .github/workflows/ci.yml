name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt bandit

      - name: Run Flake8
        run: |
          python -m flake8 app.py tests

      - name: Run Unit Tests
        run: |
          python -m pytest

      - name: Scan application code with Bandit
        run: |
          python -m bandit app.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan git history with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
